[build]
  base = "frontend"
  publish = "dist/frontend/browser"
  command = "npm run build"

# Proxy all /api requests from Netlify to your Render backend
[[redirects]]
  from = "/api/*"
  to = "https://prepmaster-pro.onrender.com"
  status = 200
  force = true

# SPA fallback for Angular routes
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200